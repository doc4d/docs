name: i18n auto-translate

# Propagates English doc changes (docs/, versioned_docs/) to i18n/<lang>/,
# translates them with an LLM and opens a Pull Request against main.
# See tools/i18n-sync/README.md

on:
  push:
    branches: [main]
    paths:
      - 'docs/**'
      - 'versioned_docs/**'
  workflow_dispatch:
    inputs:
      base:
        description: 'Base commit SHA to diff from (optional, default: previous commit)'
        required: false
        default: ''
      langs:
        description: 'Comma-separated target locales (optional)'
        required: false
        default: 'fr,es,ja,pt'

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: i18n-sync
  cancel-in-progress: false

jobs:
  translate:
    # Loop prevention ([i18n-bot] commits) and Crowdin commits/merges (l10n_* branches) are ignored
    if: >-
      github.event_name == 'workflow_dispatch' || (
        !contains(github.event.head_commit.message, '[i18n-bot]') &&
        !contains(github.event.head_commit.message, 'l10n_') &&
        !contains(github.event.head_commit.message, 'New Crowdin') &&
        !contains(github.event.head_commit.message, 'New translations') &&
        !contains(github.event.head_commit.author.name, 'crowdin')
      )
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '22.x'

      # Installed in the script folder so that the site package.json / package-lock.json are not altered
      - name: Install OpenAI SDK
        run: npm install --no-save --no-package-lock --no-audit --no-fund --prefix tools/i18n-sync openai@7

      - name: Resolve base commit
        id: base
        env:
          INPUT_BASE: ${{ inputs.base }}
          EVENT_BEFORE: ${{ github.event.before }}
        run: |
          BASE="${INPUT_BASE:-$EVENT_BEFORE}"
          if [ -z "$BASE" ] || [[ "$BASE" =~ ^0+$ ]] || ! git cat-file -e "${BASE}^{commit}" 2>/dev/null; then
            echo "Base '${BASE}' not usable, falling back to HEAD~1"
            BASE="$(git rev-parse HEAD~1)"
          fi
          BASE="$(git rev-parse --verify "${BASE}^{commit}")"
          echo "sha=$BASE" >> "$GITHUB_OUTPUT"
          echo "short=${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - name: Translate changed docs
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_MODEL: ${{ vars.I18N_MODEL || 'gpt-4.1' }}
          BASE_SHA: ${{ steps.base.outputs.sha }}
          HEAD_SHA: ${{ github.sha }}
          LANGS: ${{ inputs.langs || 'fr,es,ja,pt' }}
        run: node tools/i18n-sync/i18n-sync.mjs

      - name: Create Pull Request
        uses: peter-evans/create-pull-request@c5a7806660adbe173f04e3e038b0ccdcd758773c # v6
        with:
          branch: i18n/auto-${{ github.sha }}
          base: main
          add-paths: i18n/**
          commit-message: '[i18n-bot] Automatic translations for ${{ github.sha }}'
          title: '🌐 Automatic translations (${{ steps.base.outputs.short }})'
          body: |
            Automatic translations generated from the English documentation changes:
            ${{ github.server_url }}/${{ github.repository }}/compare/${{ steps.base.outputs.sha }}...${{ github.sha }}

            ⚠️ These translations were produced by an LLM (`${{ vars.I18N_MODEL || 'gpt-4.1' }}`). **Please review them before merging.**

            Generated by `.github/workflows/i18n-auto-translate.yml` (see `tools/i18n-sync/README.md`).
          labels: translation, automated
          delete-branch: true
